name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            binary: txt2dirart
            strip: "--strip"
          - os: windows-latest
            target: windows
            binary: txt2dirart.exe
            strip: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Oldest runner-supported Python we can get, for the widest glibc
          # compatibility on the Linux build.
          python-version: "3.11"

      - name: install pyinstaller
        run: python -m pip install --quiet pyinstaller pytest

      - name: tests must pass before anything is built
        run: python -m pytest tests/ -q

      - name: build single-file binary
        # The tool imports argparse, os and sys. Nothing else. Left to itself
        # PyInstaller still bundles most of the stdlib, which put the Linux
        # binary at 16.5 MB for a 500-line script -- eight times the size of
        # the whole png2prg download. Excluding the modules we provably never
        # import takes it to about a third of that.
        #
        # --strip on Linux ONLY (see matrix.strip).
        #
        # On Windows it corrupts the bundled python311.dll -- the binary builds
        # cleanly and then dies with "Failed to load Python DLL / LoadLibrary:
        # Invalid access to memory location" (exit 127), which is how
        # v0.9.0-rc2 failed. It is worth nothing there anyway: 53 KB of 5.3 MB.
        #
        # On Linux it is most of the binary. v0.9.0-rc3 shipped a 12.1 MB Linux
        # build of which 8.6 MB was libpython3.11.so carrying its symbols. The
        # rc2 Linux job ran with --strip and passed the smoke test, so it is
        # known to be safe on this platform.
        #
        # An over-aggressive exclude list produces a binary that builds fine
        # and dies at startup, which is why the smoke test below is not
        # optional. If you add an import to txt2dirart.py, check it is not on
        # this list.
        run: >
          pyinstaller --onefile --name txt2dirart
          --console --noupx ${{ matrix.strip }}
          --exclude-module tkinter --exclude-module unittest
          --exclude-module email --exclude-module http
          --exclude-module xml --exclude-module xmlrpc
          --exclude-module pydoc --exclude-module doctest
          --exclude-module pdb --exclude-module sqlite3
          --exclude-module ssl --exclude-module hashlib
          --exclude-module lzma --exclude-module bz2
          --exclude-module socket --exclude-module multiprocessing
          --exclude-module asyncio --exclude-module logging
          --exclude-module pickle --exclude-module json
          --exclude-module csv --exclude-module decimal
          --exclude-module datetime --exclude-module calendar
          txt2dirart.py

      - name: the binary must actually run
        # A PyInstaller build can succeed and still produce something that
        # cannot start. Exercise the real paths: version, a dry run, a real
        # stamp, and a refusal with its exit code.
        shell: bash
        run: |
          BIN="dist/${{ matrix.binary }}"
          "$BIN" --version
          "$BIN" tests/fixtures/three_files.d64 \
                 --from-text art-examples/01-simple-frame.txt --dry-run
          cp tests/fixtures/three_files.d64 smoke.d64
          # the plain form, no flags: stamps the named disk in place
          "$BIN" smoke.d64 --from-text art-examples/02-interleaved.txt
          "$BIN" smoke.d64 --from-text art-examples/01-simple-frame.txt --in-place
          "$BIN" smoke.d64 --from-text art-examples/03-petscii-escapes.txt -o smoke2.d64
          set +e
          echo '@nosuchfile' > bad.txt
          "$BIN" smoke.d64 --from-text bad.txt --in-place
          [ $? -eq 5 ] || { echo "::error::unknown token should exit 5"; exit 1; }
          set -e
          echo "binary smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: txt2dirart-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  package:
    name: package and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: assemble the zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="txt2dirart-${VERSION}"
          mkdir -p "$DIR/art-examples" "$DIR/docs"
          cp artifacts/txt2dirart-windows/txt2dirart.exe "$DIR/"
          cp artifacts/txt2dirart-linux/txt2dirart       "$DIR/"
          chmod +x "$DIR/txt2dirart"
          cp txt2dirart.py README.md CHANGELOG.md LICENSE "$DIR/"
          # Everything in art-examples/, not just *.txt: its README is the
          # file that explains why the examples' @tokens fail on your own disk,
          # which is the first thing a new user hits. rc3 shipped without it.
          cp art-examples/* "$DIR/art-examples/"
          # The README embeds these; without them its images are dead offline.
          cp docs/*.png "$DIR/docs/"
          cp examples.d64 "$DIR/"
          # The practice disk: the only disk in the download that holds the files
          # the art examples' @tokens name. Without it examples 02 and 03 fail on
          # first contact.
          cp testdisk.d64 "$DIR/"
          zip -r -q "${DIR}.zip" "$DIR"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=${DIR}.zip"   >> "$GITHUB_ENV"
          unzip -l "${DIR}.zip"
          # A file the zip is supposed to carry going missing must fail the
          # build. rc3 shipped without art-examples/README.md and nothing
          # noticed until the listing was read by eye.
          required="txt2dirart txt2dirart.exe txt2dirart.py README.md CHANGELOG.md LICENSE"
          required="$required examples.d64 testdisk.d64 art-examples/README.md"
          required="$required art-examples/01-simple-frame.txt art-examples/03-petscii-escapes.txt"
          required="$required docs/listing-on-a-c64.png docs/petscii-frame-on-a-c64.png"
          listing=$(unzip -Z1 "${DIR}.zip")
          for f in $required; do
            echo "$listing" | grep -qxF "${DIR}/${f}" || { echo "::error::missing from the zip: $f"; exit 1; }
          done
          echo "zip contents verified"

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: txt2dirart ${{ env.VERSION }}
          body_path: CHANGELOG.md
          # A tag with a suffix (v0.9.0-rc1, v1.0-beta) is a trial run, not a
          # release. Without this it publishes as the repo's latest release and
          # anyone landing on the page downloads a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.ZIP }}
            examples.d64
